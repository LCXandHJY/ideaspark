name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Start app
        run: |
          python app.py > app.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:5050/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5050/ > /dev/null || {
            echo "===== app.log ====="
            cat app.log
            echo "===== HTTP response ====="
            curl -s http://127.0.0.1:5050/ | head -80
            exit 1
          }

      - name: Run smoke tests
        run: python smoke_test.py

      - name: Show app log on failure
        if: failure()
        run: cat app.log 2>/dev/null || true
