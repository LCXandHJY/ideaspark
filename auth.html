{% extends "base.html" %}
{% block title %}{{ '注册' if mode=='register' else '登录' }} · IdeaSpark{% endblock %}
{% block content %}
<section class="panel auth">
  <h2>{{ '🎉 创建账号' if mode=='register' else '👋 欢迎回来' }}</h2>
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <form method="post" class="auth-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input name="username" required maxlength="20" placeholder="用户名（2-20位中英文/数字）">
    <input name="password" type="password" required minlength="6" placeholder="密码（至少6位）">
    <button class="btn big" type="submit">{{ '注册并进入' if mode=='register' else '登录' }}</button>
  </form>
  <p class="dim">
    {% if mode=='register' %}已有账号？<a href="{{ url_for('login') }}">去登录</a>
    {% else %}没有账号？<a href="{{ url_for('register') }}">免费注册</a>{% endif %}
  </p>
</section>
{% endblock %}
